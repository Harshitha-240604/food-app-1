apiVersion: apps/v1
kind: Deployment

metadata:
  name: food-app-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: food-app

  template:
    metadata:
      labels:
        app: food-app

    spec:
      containers:
      - name: food-app-container
        image: harshithareddy24/food-app:v1

        ports:
        - containerPort: 80